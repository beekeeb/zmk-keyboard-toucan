CONFIG_ZMK_POINTING=y

# The pinnacle driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Links the touchpad's low-power sleep to ZMK's idle state (fires at CONFIG_ZMK_IDLE_TIMEOUT
# below).  This is the big battery win: without it the pad sits at full ~2.9mA the entire time
# until deep sleep.  The pad wakes instantly on any keypress (activity -> ACTIVE); the only
# ~300ms wake lag is going straight to the pad after a long idle with no key pressed first.
CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Deep sleep after 30 minutes of no keys/mouse (was 60).  On deep sleep the pad is fully shut
# down (PM suspend -> pinnacle_set_shutdown) and BLE disconnects until the next keypress.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# 'Regular' ZMK idle state (default 30000 = 30s).  With the idle-sleeper enabled above, this is
# also when the touchpad drops to its low-power sleep.  Set to 10 minutes so the pad stays fully
# responsive during a work session and only sleeps after a longer pause (still wakes on any key).
CONFIG_ZMK_IDLE_TIMEOUT=600000

# We use this because we need ZMK_PM, PM_DEVICE and ZMK_PM_DEVICE_SUSPEND_RESUME to get proper sleep notifications into the cirque driver
# since we need all that might as well also turn on SOFT_OFF (which implies all these things but adds an optional SOFT_OFF feature)
CONFIG_ZMK_PM_SOFT_OFF=y
